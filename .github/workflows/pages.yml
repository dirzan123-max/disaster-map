name: Deploy web to GitHub Pages

# Web版を GitHub Pages へ公開する。Public リポジトリなら無料で動く。
#
# 初回だけリポジトリ設定が必要:
#   Settings > Pages > Build and deployment > Source を "GitHub Actions" にする
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開の取り消し中に次のデプロイが走らないようにする。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Pages はリポジトリ名のサブパスで配信されるため base-href を合わせる。
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
